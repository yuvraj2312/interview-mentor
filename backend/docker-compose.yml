services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interview_mentor
      POSTGRES_PASSWORD: interview_mentor
      POSTGRES_DB: interview_mentor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://interview_mentor:interview_mentor@postgres:5432/interview_mentor
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: arq app.background.worker.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://interview_mentor:interview_mentor@postgres:5432/interview_mentor
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  minio_data:
