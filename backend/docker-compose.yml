services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interview_mentor
      POSTGRES_PASSWORD: interview_mentor
      POSTGRES_DB: interview_mentor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://interview_mentor:interview_mentor@postgres:5432/interview_mentor
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
